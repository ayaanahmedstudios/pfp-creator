<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Framer — PFP Cropper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0d0e10;
    --surface:#17181c;
    --surface-raised:#1f2024;
    --line:#2b2d32;
    --line-soft:#232428;
    --text:#f2f1ec;
    --text-muted:#93959c;
    --text-faint:#5c5e64;
    --signal:#ff5c35;
    --signal-dim:#ff5c3522;
    --mint:#3ddc97;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  .app{
    max-width:1120px;
    margin:0 auto;
    padding:20px 20px 100px;
    min-height:100dvh;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:6px 2px 26px;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:28px;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    width:11px;height:11px;border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 0 3px var(--signal-dim);
    flex:none;
    transform:translateY(-1px);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  header p{
    margin:0;
    color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }

  /* ---------- Workspace layout ---------- */
  .workspace{
    display:grid;
    grid-template-columns:minmax(0,1fr) 320px;
    gap:28px;
    align-items:start;
  }
  @media (max-width:860px){
    .workspace{grid-template-columns:1fr;}
    .app{padding:16px 14px 110px;}
  }

  /* ---------- Stage panel ---------- */
  .stage-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .stage-frame{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio:1/1;
    padding:22px;
  }
  .bracket{
    position:absolute;
    width:20px;height:20px;
    border:2px solid var(--text-faint);
    opacity:.7;
  }
  .bracket.tl{top:0;left:0;border-right:none;border-bottom:none;border-top-left-radius:4px;}
  .bracket.tr{top:0;right:0;border-left:none;border-bottom:none;border-top-right-radius:4px;}
  .bracket.bl{bottom:0;left:0;border-right:none;border-top:none;border-bottom-left-radius:4px;}
  .bracket.br{bottom:0;right:0;border-left:none;border-top:none;border-bottom-right-radius:4px;}

  .stage{
    position:relative;
    width:100%;
    height:100%;
    border-radius:10px;
    background:
      linear-gradient(45deg,#1b1c20 25%,transparent 25%) 0 0/22px 22px,
      linear-gradient(-45deg,#1b1c20 25%,transparent 25%) 0 0/22px 22px,
      linear-gradient(45deg,transparent 75%,#1b1c20 75%) 0 0/22px 22px,
      linear-gradient(-45deg,transparent 75%,#1b1c20 75%) 0 0/22px 22px,
      #131417;
    overflow:hidden;
    touch-action:none;
    cursor:grab;
    user-select:none;
  }
  .stage.dragging{cursor:grabbing;}
  .stage img{
    position:absolute;
    left:0;top:0;
    max-width:none;
    max-height:none;
    pointer-events:none;
    display:block;
  }
  .crop-mask{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    box-shadow:0 0 0 2000px rgba(9,10,12,.74);
    pointer-events:none;
  }
  .ring-preview{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    box-sizing:border-box;
  }
  .placeholder{
    position:absolute;inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:20px;
    cursor:pointer;
  }
  .placeholder .icon{
    width:44px;height:44px;
    border-radius:50%;
    border:1.5px dashed var(--text-faint);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);
    font-size:20px;
  }
  .placeholder strong{font-size:14px;font-weight:500;color:var(--text);}
  .placeholder span{font-size:12px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

  .hud{
    display:flex;
    gap:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:.02em;
  }
  .hud b{color:var(--text-muted); font-weight:500;}

  .stage-actions{
    display:flex;
    gap:10px;
    width:100%;
    max-width:420px;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family:'Inter',sans-serif;
    border:none;
    cursor:pointer;
    color:var(--text);
  }
  .btn{
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 14px;
    font-size:13px;
    font-weight:500;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex:1;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:#3a3c42;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;}
  input[type=file]{display:none;}

  /* ---------- Controls panel ---------- */
  .controls{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .group{
    background:var(--surface);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:16px;
  }
  .group h2{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }
  .row:last-child{margin-bottom:0;}
  .row label{font-size:13px; color:var(--text-muted); flex:none;}
  .row .value{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    min-width:34px;
    text-align:right;
  }

  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:3px;
    background:var(--line);
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--signal);
    border:2px solid #0d0e10;
    cursor:pointer;
    margin-top:0;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;
    border-radius:50%;
    background:var(--signal);
    border:2px solid #0d0e10;
    cursor:pointer;
  }

  .slider-row{display:flex; align-items:center; gap:10px;}
  .slider-row input[type=range]{flex:1;}

  /* toggle switch */
  .switch{
    position:relative;
    width:38px;height:22px;
    background:var(--line);
    border-radius:20px;
    cursor:pointer;
    transition:background .15s ease;
    flex:none;
  }
  .switch.on{background:var(--signal);}
  .switch::after{
    content:'';
    position:absolute;
    top:2px;left:2px;
    width:18px;height:18px;
    background:#fff;
    border-radius:50%;
    transition:transform .15s ease;
  }
  .switch.on::after{transform:translateX(16px);}

  .swatch{
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid var(--line);
    padding:0;
    overflow:hidden;
    position:relative;
    flex:none;
  }
  .swatch input[type=color]{
    position:absolute;
    top:-4px;left:-4px;
    width:38px;height:38px;
    border:none;
    padding:0;
    cursor:pointer;
  }

  select{
    background:var(--surface-raised);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 8px;
    font-size:12px;
    font-family:'Inter',sans-serif;
  }

  .segmented{
    display:flex;
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:2px;
    gap:2px;
  }
  .segmented button{
    flex:1;
    background:transparent;
    border-radius:6px;
    padding:7px 4px;
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    color:var(--text-faint);
  }
  .segmented button.active{
    background:var(--signal);
    color:#100b08;
    font-weight:500;
  }

  .bg-row{display:flex; gap:8px;}
  .bg-opt{
    flex:1;
    padding:8px 6px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--surface-raised);
    font-size:11px;
    color:var(--text-faint);
    text-align:center;
  }
  .bg-opt.active{border-color:var(--signal); color:var(--text); background:#241a15;}

  /* ---------- Result preview ---------- */
  .result{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .result-canvas-wrap{
    width:64px;height:64px;
    border-radius:50%;
    flex:none;
    background:
      linear-gradient(45deg,#26272c 25%,transparent 25%) 0 0/10px 10px,
      linear-gradient(-45deg,#26272c 25%,transparent 25%) 0 0/10px 10px,
      linear-gradient(45deg,transparent 75%,#26272c 75%) 0 0/10px 10px,
      linear-gradient(-45deg,transparent 75%,#26272c 75%) 0 0/10px 10px,
      #17181c;
    overflow:hidden;
  }
  .result-canvas-wrap canvas{width:100%;height:100%;display:block;}
  .result-text{font-size:11.5px; color:var(--text-faint); line-height:1.5; font-family:'JetBrains Mono',monospace;}

  /* ---------- Export bar ---------- */
  .export-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--void) 60%, transparent);
    z-index:20;
    pointer-events:none;
  }
  .export-bar .inner{
    width:100%;
    max-width:520px;
    display:flex;
    gap:10px;
    pointer-events:auto;
  }
  .save-btn{
    flex:1;
    background:var(--signal);
    color:#140d09;
    border-radius:12px;
    padding:14px 18px;
    font-size:14.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 8px 24px -6px rgba(255,92,53,.45);
  }
  .save-btn:active{transform:scale(.985);}
  .toast{
    position:fixed;
    left:50%;
    bottom:88px;
    transform:translateX(-50%) translateY(8px);
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 16px;
    border-radius:20px;
    font-size:12.5px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    z-index:30;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--signal); color:#100b08;}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="mark"></div>
      <h1>Framer</h1>
    </div>
    <p>Logo → profile picture</p>
  </header>

  <div class="workspace">
    <!-- STAGE -->
    <section class="stage-panel">
      <div class="stage-frame">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
        <div class="stage" id="stage">
          <img id="dragImg" alt="" draggable="false">
          <div class="crop-mask" id="cropMask"></div>
          <div class="ring-preview" id="ringPreview"></div>
          <div class="placeholder" id="placeholder">
            <div class="icon">↑</div>
            <strong>Drop a logo here</strong>
            <span>or tap to upload · PNG / JPG / SVG</span>
          </div>
        </div>
      </div>
      <div class="hud">
        <span>ZOOM <b id="hudZoom">100%</b></span>
        <span>OUT <b id="hudSize">1024×1024</b></span>
        <span>FMT <b>PNG · ALPHA</b></span>
      </div>
      <div class="stage-actions">
        <button class="btn ghost" id="replaceBtn">Replace image</button>
        <button class="btn ghost" id="centerBtn">Recenter</button>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </section>

    <!-- CONTROLS -->
    <aside class="controls">

      <div class="group">
        <h2>Position &amp; Zoom</h2>
        <div class="slider-row">
          <span style="font-size:12px;color:var(--text-faint);">−</span>
          <input type="range" id="zoomSlider" min="100" max="400" value="100" step="1">
          <span style="font-size:12px;color:var(--text-faint);">+</span>
        </div>
      </div>

      <div class="group">
        <h2>
          Border
          <div class="switch" id="borderSwitch"></div>
        </h2>
        <div class="row">
          <label>Style</label>
          <select id="borderStyle">
            <option value="solid">Solid</option>
            <option value="dashed">Dashed</option>
            <option value="dotted">Dotted</option>
            <option value="double">Double</option>
          </select>
        </div>
        <div class="row">
          <label>Thickness</label>
          <div class="slider-row" style="flex:1; margin-left:10px;">
            <input type="range" id="borderWidth" min="0" max="60" value="24">
            <span class="value" id="borderWidthVal">24</span>
          </div>
        </div>
        <div class="row">
          <label>Padding</label>
          <div class="slider-row" style="flex:1; margin-left:10px;">
            <input type="range" id="borderGap" min="0" max="50" value="8">
            <span class="value" id="borderGapVal">8</span>
          </div>
        </div>
        <div class="row">
          <label>Color</label>
          <div class="swatch" id="borderSwatch" style="background:#ff5c35;">
            <input type="color" id="borderColor" value="#ff5c35">
          </div>
        </div>
      </div>

      <div class="group">
        <h2>Background</h2>
        <div class="bg-row">
          <div class="bg-opt active" id="bgTransparent">Transparent</div>
          <div class="bg-opt" id="bgSolid">Solid color</div>
        </div>
        <div class="row" id="bgColorRow" style="margin-top:12px; display:none;">
          <label>Fill</label>
          <div class="swatch" id="bgSwatch" style="background:#141417;">
            <input type="color" id="bgColor" value="#141417">
          </div>
        </div>
      </div>

      <div class="group">
        <h2>Output size</h2>
        <div class="segmented" id="sizeSeg">
          <button data-size="512">512</button>
          <button data-size="1024" class="active">1024</button>
          <button data-size="2048">2048</button>
        </div>
      </div>

      <div class="group result">
        <div class="result-canvas-wrap"><canvas id="resultCanvas"></canvas></div>
        <div class="result-text">Live result<br>transparent outside the ring<br>updates as you edit</div>
      </div>

    </aside>
  </div>
</div>

<div class="export-bar">
  <div class="inner">
    <button class="save-btn" id="saveBtn">Save profile picture</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const UNIT = 1000; // virtual coordinate space for the square stage

  // ---- state ----
  let img = null;
  let naturalW = 0, naturalH = 0;
  let baseScale = 0;      // cover-fit scale at userScale=1, in unit space
  let userScale = 1;      // 1..4
  let dispW = 0, dispH = 0; // displayed size in unit space
  let offX = 0, offY = 0; // top-left offset in unit space

  let borderEnabled = true;
  let borderStyle = 'solid';
  let borderWidthRef = 24;  // px per 1000 units
  let borderGapRef = 8;
  let borderColor = '#ff5c35';
  let bgMode = 'transparent'; // 'transparent' | 'solid'
  let bgColor = '#141417';
  let outputSize = 1024;

  // ---- elements ----
  const stage = document.getElementById('stage');
  const dragImg = document.getElementById('dragImg');
  const placeholder = document.getElementById('placeholder');
  const cropMask = document.getElementById('cropMask');
  const ringPreview = document.getElementById('ringPreview');
  const fileInput = document.getElementById('fileInput');
  const zoomSlider = document.getElementById('zoomSlider');
  const hudZoom = document.getElementById('hudZoom');
  const hudSize = document.getElementById('hudSize');
  const resultCanvas = document.getElementById('resultCanvas');
  const toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 2600);
  }

  // ---------------- Image loading ----------------
  function loadFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e=>{
      const image = new Image();
      image.onload = ()=>{
        img = image;
        naturalW = image.naturalWidth;
        naturalH = image.naturalHeight;
        dragImg.src = e.target.result;
        placeholder.style.display = 'none';
        userScale = 1;
        zoomSlider.value = 100;
        resetFit();
        layoutImage();
        updateOverlays();
        renderResult();
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function resetFit(){
    baseScale = Math.max(UNIT / naturalW, UNIT / naturalH);
    dispW = naturalW * baseScale * userScale;
    dispH = naturalH * baseScale * userScale;
    offX = (UNIT - dispW) / 2;
    offY = (UNIT - dispH) / 2;
  }

  function layoutImage(){
    dragImg.style.width = (dispW/10) + '%';
    dragImg.style.height = (dispH/10) + '%';
    dragImg.style.left = (offX/10) + '%';
    dragImg.style.top = (offY/10) + '%';
  }

  function clampOffsets(){
    const minX = Math.min(0, UNIT - dispW);
    const minY = Math.min(0, UNIT - dispH);
    offX = Math.max(minX, Math.min(0, offX));
    offY = Math.max(minY, Math.min(0, offY));
  }

  function applyZoom(newScale, anchorRatioX, anchorRatioY){
    newScale = Math.max(1, Math.min(4, newScale));
    const oldDispW = dispW, oldDispH = dispH;
    userScale = newScale;
    dispW = naturalW * baseScale * userScale;
    dispH = naturalH * baseScale * userScale;
    // keep the same relative point under the anchor fixed
    const ax = anchorRatioX === undefined ? 0.5 : anchorRatioX;
    const ay = anchorRatioY === undefined ? 0.5 : anchorRatioY;
    offX -= (dispW - oldDispW) * ax;
    offY -= (dispH - oldDispH) * ay;
    clampOffsets();
    layoutImage();
    zoomSlider.value = Math.round(userScale*100);
    hudZoom.textContent = Math.round(userScale*100) + '%';
  }

  // ---------------- Overlay geometry (mask + ring) ----------------
  function geometry(sizeUnit){
    // sizeUnit = UNIT (1000). Returns radii in unit space.
    const strokeW = borderEnabled ? borderWidthRef : 0;
    const gapW = borderGapRef;
    const outerR = sizeUnit/2 - strokeW/2;
    const contentR = Math.max(0, outerR - strokeW/2 - gapW);
    return {strokeW, outerR, contentR};
  }

  function updateOverlays(){
    const {strokeW, outerR, contentR} = geometry(UNIT);
    const cd = (contentR*2/UNIT*100);
    cropMask.style.width = cd + '%';
    cropMask.style.height = cd + '%';

    if(borderEnabled && strokeW > 0){
      ringPreview.style.display = 'block';
      const rectW = stage.getBoundingClientRect().width || 340;
      const strokePx = Math.max(1, (strokeW/UNIT) * rectW);
      const od = (outerR*2/UNIT*100);
      ringPreview.style.width = od + '%';
      ringPreview.style.height = od + '%';
      ringPreview.style.borderStyle = borderStyle === 'double' ? 'double' : borderStyle;
      ringPreview.style.borderColor = borderColor;
      ringPreview.style.borderWidth = (borderStyle === 'double' ? strokePx*1.35 : strokePx) + 'px';
    } else {
      ringPreview.style.display = 'none';
    }
  }

  // ---------------- Canvas render (used for live result + export) ----------------
  function renderToCanvas(canvas, size){
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);

    if(bgMode === 'solid'){
      ctx.fillStyle = bgColor;
      ctx.fillRect(0,0,size,size);
    }

    const {strokeW, outerR, contentR} = geometry(size);
    const cx = size/2, cy = size/2;
    const scaleF = size / UNIT;

    if(img){
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(contentR,0), 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(img, offX*scaleF, offY*scaleF, dispW*scaleF, dispH*scaleF);
      ctx.restore();
    }

    if(borderEnabled && strokeW > 0){
      ctx.save();
      ctx.strokeStyle = borderColor;
      ctx.lineCap = 'butt';
      const ringR = outerR;
      if(borderStyle === 'dashed'){
        ctx.setLineDash([strokeW*1.6, strokeW*1.15]);
        ctx.lineWidth = strokeW;
        ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2); ctx.stroke();
      } else if(borderStyle === 'dotted'){
        ctx.setLineDash([strokeW*0.18, strokeW*1.05]);
        ctx.lineCap = 'round';
        ctx.lineWidth = strokeW;
        ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2); ctx.stroke();
      } else if(borderStyle === 'double'){
        ctx.setLineDash([]);
        ctx.lineWidth = strokeW*0.32;
        const gapD = strokeW*0.42;
        ctx.beginPath(); ctx.arc(cx,cy,ringR+gapD,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx,cy,ringR-gapD,0,Math.PI*2); ctx.stroke();
      } else {
        ctx.setLineDash([]);
        ctx.lineWidth = strokeW;
        ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function renderResult(){
    renderToCanvas(resultCanvas, 200);
  }

  // ---------------- Pointer drag ----------------
  let dragging = false;
  let dragStartX=0, dragStartY=0, startOffX=0, startOffY=0;
  const activePointers = new Map();
  let pinchStartDist = 0, pinchStartScale = 1;

  stage.addEventListener('pointerdown', e=>{
    if(!img) return;
    stage.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size === 1){
      dragging = true;
      stage.classList.add('dragging');
      dragStartX = e.clientX; dragStartY = e.clientY;
      startOffX = offX; startOffY = offY;
    } else if(activePointers.size === 2){
      dragging = false;
      const pts = [...activePointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinchStartScale = userScale;
    }
  });

  stage.addEventListener('pointermove', e=>{
    if(!img || !activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const rect = stage.getBoundingClientRect();

    if(activePointers.size === 2){
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(pinchStartDist > 0){
        applyZoom(pinchStartScale * (dist/pinchStartDist));
      }
      return;
    }

    if(dragging){
      const dxUnit = (e.clientX - dragStartX) / rect.width * UNIT;
      const dyUnit = (e.clientY - dragStartY) / rect.height * UNIT;
      offX = startOffX + dxUnit;
      offY = startOffY + dyUnit;
      clampOffsets();
      layoutImage();
    }
  });

  function endPointer(e){
    activePointers.delete(e.pointerId);
    if(activePointers.size === 0){
      if(dragging) renderResult();
      dragging = false;
      stage.classList.remove('dragging');
    } else if(activePointers.size === 1){
      const [pt] = [...activePointers.values()];
      dragging = true;
      dragStartX = pt.x; dragStartY = pt.y;
      startOffX = offX; startOffY = offY;
      renderResult();
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('pointerleave', e=>{ if(activePointers.size<=1){} });

  stage.addEventListener('wheel', e=>{
    if(!img) return;
    e.preventDefault();
    applyZoom(userScale - e.deltaY*0.0018);
    renderResult();
  }, {passive:false});

  // ---------------- Upload / drop ----------------
  placeholder.addEventListener('click', ()=>fileInput.click());
  document.getElementById('replaceBtn').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', e=>{
    if(e.target.files[0]) loadFile(e.target.files[0]);
  });
  ['dragover'].forEach(evt=>{
    stage.addEventListener(evt, e=>{ e.preventDefault(); });
  });
  stage.addEventListener('drop', e=>{
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) loadFile(file);
  });

  document.getElementById('centerBtn').addEventListener('click', ()=>{
    if(!img) return;
    userScale = 1;
    resetFit();
    layoutImage();
    zoomSlider.value = 100;
    hudZoom.textContent = '100%';
    renderResult();
  });

  // ---------------- Zoom slider ----------------
  zoomSlider.addEventListener('input', ()=>{
    if(!img) return;
    applyZoom(zoomSlider.value/100);
  });
  zoomSlider.addEventListener('change', renderResult);

  // ---------------- Border controls ----------------
  const borderSwitch = document.getElementById('borderSwitch');
  borderSwitch.classList.add('on');
  borderSwitch.addEventListener('click', ()=>{
    borderEnabled = !borderEnabled;
    borderSwitch.classList.toggle('on', borderEnabled);
    updateOverlays(); renderResult();
  });

  document.getElementById('borderStyle').addEventListener('change', e=>{
    borderStyle = e.target.value;
    updateOverlays(); renderResult();
  });

  const borderWidthInput = document.getElementById('borderWidth');
  const borderWidthVal = document.getElementById('borderWidthVal');
  borderWidthInput.addEventListener('input', e=>{
    borderWidthRef = +e.target.value;
    borderWidthVal.textContent = borderWidthRef;
    updateOverlays(); renderResult();
  });

  const borderGapInput = document.getElementById('borderGap');
  const borderGapVal = document.getElementById('borderGapVal');
  borderGapInput.addEventListener('input', e=>{
    borderGapRef = +e.target.value;
    borderGapVal.textContent = borderGapRef;
    updateOverlays(); renderResult();
  });

  const borderColorInput = document.getElementById('borderColor');
  const borderSwatch = document.getElementById('borderSwatch');
  borderColorInput.addEventListener('input', e=>{
    borderColor = e.target.value;
    borderSwatch.style.background = borderColor;
    updateOverlays(); renderResult();
  });

  // ---------------- Background controls ----------------
  const bgTransparentBtn = document.getElementById('bgTransparent');
  const bgSolidBtn = document.getElementById('bgSolid');
  const bgColorRow = document.getElementById('bgColorRow');
  bgTransparentBtn.addEventListener('click', ()=>{
    bgMode='transparent';
    bgTransparentBtn.classList.add('active');
    bgSolidBtn.classList.remove('active');
    bgColorRow.style.display='none';
    renderResult();
  });
  bgSolidBtn.addEventListener('click', ()=>{
    bgMode='solid';
    bgSolidBtn.classList.add('active');
    bgTransparentBtn.classList.remove('active');
    bgColorRow.style.display='flex';
    renderResult();
  });
  const bgColorInput = document.getElementById('bgColor');
  const bgSwatch = document.getElementById('bgSwatch');
  bgColorInput.addEventListener('input', e=>{
    bgColor = e.target.value;
    bgSwatch.style.background = bgColor;
    renderResult();
  });

  // ---------------- Output size ----------------
  document.querySelectorAll('#sizeSeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#sizeSeg button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      outputSize = +btn.dataset.size;
      hudSize.textContent = outputSize + '×' + outputSize;
    });
  });

  // ---------------- Resize ----------------
  window.addEventListener('resize', ()=>{ updateOverlays(); });

  // ---------------- Save / Export ----------------
  const isMobileUA = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.textContent = isMobileUA ? 'Save to Photos' : 'Download PNG';

  function downloadBlob(blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'profile-picture.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  saveBtn.addEventListener('click', ()=>{
    if(!img){ showToast('Upload a logo first'); return; }
    const exportCanvas = document.createElement('canvas');
    renderToCanvas(exportCanvas, outputSize);
    exportCanvas.toBlob(async blob=>{
      if(!blob){ showToast('Export failed — try again'); return; }
      const file = new File([blob], 'profile-picture.png', {type:'image/png'});
      if(isMobileUA && navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'Profile picture'});
          showToast('Choose "Save Image" to add it to your gallery');
        }catch(err){
          if(err && err.name !== 'AbortError'){
            downloadBlob(blob);
            showToast('Saved to your downloads');
          }
        }
      } else {
        downloadBlob(blob);
        showToast(isMobileUA ? 'Saved to your downloads' : 'Downloaded');
      }
    }, 'image/png', 1);
  });

  // init
  updateOverlays();
  hudSize.textContent = outputSize + '×' + outputSize;
})();
</script>
</body>
</html>
