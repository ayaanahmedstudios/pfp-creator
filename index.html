<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PFP Creator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath fill='%23B026FF' d='M128,20A108,108,0,1,0,236,128,108.12,108.12,0,0,0,128,20ZM79.57,196.57a60,60,0,0,1,96.86,0,83.72,83.72,0,0,1-96.86,0ZM100,120a28,28,0,1,1,28,28A28,28,0,0,1,100,120ZM194,179.89a83.48,83.48,0,0,0-29-23.42,52,52,0,1,0-74,0,83.48,83.48,0,0,0-29,23.42,84,84,0,1,1,131.9,0Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Geist:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root {
    --bg: #09090d;
    --bg-elevated: #101016;
    --surface: #15151d;
    --surface-2: #1e1e29;
    --surface-3: #282836;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.15);
    --text: #fafafa;
    --text-2: #a1a1b5;
    --text-3: #646478;
    --accent: #6366f1;
    --accent-soft: rgba(99, 102, 241, 0.16);
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius-xl: 18px;
    --radius-lg: 12px;
    --radius-md: 8px;
    --radius-sm: 6px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  button, select, input {
    font-family: inherit;
    color: inherit;
    border: none;
    background: none;
    outline: none;
  }

  button {
    cursor: pointer;
    user-select: none;
  }

  input[type="file"] {
    display: none;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 60;
    height: 54px;
    background: rgba(9, 9, 13, 0.82);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .brand i {
    font-size: 20px;
    color: var(--accent);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .size-pill {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 2px;
  }

  .size-pill button {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }

  .size-pill button.active {
    background: var(--accent);
    color: #ffffff;
  }

  .export-trigger {
    background: var(--accent);
    color: #ffffff;
    height: 34px;
    padding: 0 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 4px 16px -4px rgba(99, 102, 241, 0.55);
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  .export-trigger:hover {
    filter: brightness(1.08);
  }

  .export-trigger:active {
    transform: scale(0.97);
  }

  .studio-shell {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .editor-deck {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 24px;
    align-items: stretch;
    min-height: 580px;
  }

  .viewport-well {
    position: relative;
    background-color: var(--bg-elevated);
    background-image: radial-gradient(rgba(99, 102, 241, 0.12) 1px, transparent 1px);
    background-size: 20px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 76px;
    overflow: hidden;
  }

  .stage-frame {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1 / 1;
    border-radius: 28px;
    box-shadow: 0 28px 70px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px var(--border-strong);
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: #13131a;
    background-image: 
      linear-gradient(45deg, #1b1b24 25%, transparent 25%), 
      linear-gradient(-45deg, #1b1b24 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #1b1b24 75%), 
      linear-gradient(-45deg, transparent 75%, #1b1b24 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    overflow: hidden;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
    transform: translateZ(0);
    isolation: isolate;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }

  .stage.dragging {
    cursor: grabbing;
  }

  .stage-bg-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .stage img {
    position: absolute;
    left: 0;
    top: 0;
    max-width: none;
    max-height: none;
    pointer-events: none;
    display: block;
    transform-origin: 50% 50%;
    will-change: transform, filter;
  }

  .crop-mask {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    box-shadow: 0 0 0 2000px rgba(9, 9, 13, 0.78);
    pointer-events: none;
    transition: border-radius 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .ring-preview {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    box-sizing: border-box;
    transition: border-radius 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .grid-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.18s ease, border-radius 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    border-radius: 50%;
    z-index: 12;
    border: 1px solid rgba(255, 255, 255, 0.28);
  }

  .grid-overlay.active {
    opacity: 1;
  }

  .grid-overlay::before,
  .grid-overlay::after {
    content: '';
    position: absolute;
    inset: 0;
  }

  .grid-overlay::before {
    background: linear-gradient(
      to right,
      transparent 33.33%,
      rgba(255, 255, 255, 0.24) 33.33%,
      rgba(255, 255, 255, 0.24) calc(33.33% + 1px),
      transparent calc(33.33% + 1px),
      transparent 66.66%,
      rgba(255, 255, 255, 0.24) 66.66%,
      rgba(255, 255, 255, 0.24) calc(66.66% + 1px),
      transparent calc(66.66% + 1px)
    );
  }

  .grid-overlay::after {
    background: linear-gradient(
      to bottom,
      transparent 33.33%,
      rgba(255, 255, 255, 0.24) 33.33%,
      rgba(255, 255, 255, 0.24) calc(33.33% + 1px),
      transparent calc(33.33% + 1px),
      transparent 66.66%,
      rgba(255, 255, 255, 0.24) 66.66%,
      rgba(255, 255, 255, 0.24) calc(66.66% + 1px),
      transparent calc(66.66% + 1px)
    );
  }

  .grid-center-cross {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    transform: translate(-50%, -50%);
  }

  .grid-center-cross::before,
  .grid-center-cross::after {
    content: '';
    position: absolute;
    background: var(--accent);
  }

  .grid-center-cross::before {
    top: 6px;
    left: 0;
    right: 0;
    height: 2px;
  }

  .grid-center-cross::after {
    left: 6px;
    top: 0;
    bottom: 0;
    width: 2px;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    z-index: 20;
    transition: background 0.2s ease;
  }

  .placeholder:hover {
    background: var(--surface-2);
  }

  .placeholder-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--accent-soft);
    border: 1px solid rgba(99, 102, 241, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--accent);
  }

  .placeholder strong {
    font-size: 14px;
    font-weight: 600;
  }

  .floating-hud {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(21, 21, 29, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 4px;
    display: flex;
    align-items: center;
    gap: 2px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    z-index: 25;
  }

  .hud-btn {
    height: 32px;
    padding: 0 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .hud-btn i {
    font-size: 15px;
    color: var(--text);
  }

  .hud-btn:hover {
    background: var(--surface-3);
    color: var(--text);
  }

  .hud-sep {
    width: 1px;
    height: 16px;
    background: var(--border);
    margin: 0 2px;
  }

  .inspector-dock {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .inspector-header {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .inspector-header span {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .inspector-header span i {
    color: var(--accent);
    font-size: 15px;
  }

  .reset-all-btn {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    padding: 4px 9px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .reset-all-btn:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }

  .inspector-body {
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  .prop-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .prop-section:first-child {
    border-top: none;
    padding-top: 10px;
  }

  .prop-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .prop-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    display: flex;
