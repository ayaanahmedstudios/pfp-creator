<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Framer — PFP Cropper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#1c1c1e;
    --surface-2:#2c2c2e;
    --surface-3:#3a3a3c;
    --sep: rgba(255,255,255,0.11);
    --text:#f5f5f7;
    --text-2:#98989d;
    --text-3:#636366;
    --accent:#0a84ff;
    --accent-dim: rgba(10,132,255,0.16);
    --radius-lg:18px;
    --radius-md:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Alan Sans', system-ui, -apple-system, sans-serif;
    font-feature-settings:'tnum' 1;
    min-height:100dvh;
    overflow-x:hidden;
  }
  .app{
    max-width:1080px;
    margin:0 auto;
    padding:22px 18px 110px;
    min-height:100dvh;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:2px 2px 22px;
    margin-bottom:20px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  header p{
    margin:0;
    color:var(--text-3);
    font-size:13px;
    font-weight:500;
  }

  /* ---------- Workspace layout ---------- */
  .workspace{
    display:grid;
    grid-template-columns:minmax(0,1fr) 320px;
    gap:24px;
    align-items:start;
  }
  @media (max-width:860px){
    .workspace{grid-template-columns:1fr;}
    .app{padding:18px 14px 120px;}
  }

  /* ---------- Stage panel ---------- */
  .stage-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  /* True-square container: padding-top 100% is bulletproof across browsers,
     unlike aspect-ratio which can misbehave inside grid/flex tracks. */
  .stage-frame{
    position:relative;
    width:100%;
    max-width:400px;
    padding-top:100%;
    height:0;
  }
  .stage-frame-inner{
    position:absolute;
    inset:0;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    border-radius:26px;
    background:var(--surface);
    overflow:hidden;
    touch-action:none;
    cursor:grab;
    user-select:none;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -20px rgba(0,0,0,.6);
  }
  .stage.dragging{cursor:grabbing;}
  .stage img{
    position:absolute;
    left:0;top:0;
    max-width:none;
    max-height:none;
    pointer-events:none;
    display:block;
    transform-origin:0 0;
    will-change:transform;
  }
  .crop-mask{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    box-shadow:0 0 0 2000px rgba(0,0,0,.66);
    pointer-events:none;
  }
  .ring-preview{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    box-sizing:border-box;
  }
  .placeholder{
    position:absolute;inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:20px;
    cursor:pointer;
  }
  .placeholder .icon{
    width:48px;height:48px;
    border-radius:50%;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-2);
    font-size:20px;
    font-weight:600;
  }
  .placeholder strong{font-size:15px;font-weight:600;color:var(--text);}
  .placeholder span{font-size:12.5px;color:var(--text-3); font-weight:500;}

  .hud{
    font-size:13px;
    font-weight:600;
    color:var(--text-2);
    letter-spacing:-0.01em;
  }

  .stage-actions{
    display:flex;
    gap:6px;
    width:100%;
    max-width:400px;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family:'Alan Sans', sans-serif;
    border:none;
    cursor:pointer;
    color:var(--text);
    background:none;
  }
  .text-btn{
    flex:1;
    color:var(--accent);
    font-size:14.5px;
    font-weight:600;
    padding:10px;
    border-radius:10px;
    transition:background .15s ease, opacity .15s ease;
  }
  .text-btn:active{background:var(--accent-dim);}
  input[type=file]{display:none;}

  /* ---------- Controls panel ---------- */
  .controls{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .group{
    background:var(--surface);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .group-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--text-3);
    margin:0 0 8px 14px;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:13px 14px;
    border-bottom:1px solid var(--sep);
    min-height:24px;
  }
  .row:last-child{border-bottom:none;}
  .row label{font-size:15px; color:var(--text); flex:none; font-weight:500;}
  .row .sub{font-size:12.5px; color:var(--text-3); font-weight:500; margin-top:1px;}
  .row .value{
    font-size:14px;
    font-weight:600;
    color:var(--text-2);
    min-width:30px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    background:var(--surface-3);
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:22px;height:22px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
    cursor:pointer;
    margin-top:0;
  }
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;
    border-radius:50%;
    background:#ffffff;
    border:none;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:2px;
  }

  .slider-row{display:flex; align-items:center; gap:12px; flex:1;}

  /* toggle switch */
  .switch{
    position:relative;
    width:44px;height:26px;
    background:var(--surface-3);
    border-radius:20px;
    cursor:pointer;
    transition:background .18s ease;
    flex:none;
  }
  .switch.on{background:var(--accent);}
  .switch::after{
    content:'';
    position:absolute;
    top:2px;left:2px;
    width:22px;height:22px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition:transform .18s ease;
  }
  .switch.on::after{transform:translateX(18px);}

  .swatch{
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--sep);
    padding:0;
    overflow:hidden;
    position:relative;
    flex:none;
  }
  .swatch input[type=color]{
    position:absolute;
    top:-4px;left:-4px;
    width:40px;height:40px;
    border:none;
    padding:0;
    cursor:pointer;
    background:none;
  }

  select{
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:8px;
    padding:7px 10px;
    font-size:14px;
    font-family:'Alan Sans',sans-serif;
    font-weight:500;
  }

  .segmented{
    display:flex;
    background:var(--surface-2);
    border-radius:9px;
    padding:2px;
    gap:2px;
    flex:1;
    max-width:220px;
  }
  .segmented button{
    flex:1;
    background:transparent;
    border-radius:7px;
    padding:7px 4px;
    font-size:13px;
    font-weight:600;
    color:var(--text-2);
    transition:background .15s ease, color .15s ease;
  }
  .segmented button.active{
    background:var(--surface-3);
    color:var(--text);
  }

  /* ---------- Result preview ---------- */
  .result-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px;
  }
  .result-canvas-wrap{
    width:56px;height:56px;
    border-radius:50%;
    flex:none;
    background:
      linear-gradient(45deg,#2a2a2c 25%,transparent 25%) 0 0/10px 10px,
      linear-gradient(-45deg,#2a2a2c 25%,transparent 25%) 0 0/10px 10px,
      linear-gradient(45deg,transparent 75%,#2a2a2c 75%) 0 0/10px 10px,
      linear-gradient(-45deg,transparent 75%,#2a2a2c 75%) 0 0/10px 10px,
      #1c1c1e;
    overflow:hidden;
  }
  .result-canvas-wrap canvas{width:100%;height:100%;display:block;}
  .result-text{font-size:13px; color:var(--text-3); line-height:1.45; font-weight:500;}
  .result-text b{color:var(--text-2); font-weight:600;}

  /* ---------- Export bar ---------- */
  .export-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 55%, transparent);
    z-index:20;
    pointer-events:none;
  }
  .export-bar .inner{
    width:100%;
    max-width:480px;
    pointer-events:auto;
  }
  .save-btn{
    width:100%;
    background:var(--accent);
    color:#ffffff;
    border-radius:14px;
    padding:15px 18px;
    font-size:15.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:-0.01em;
    transition:opacity .12s ease, transform .12s ease;
  }
  .save-btn:active{opacity:.85; transform:scale(.985);}
  .toast{
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%) translateY(8px);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 18px;
    border-radius:22px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    z-index:30;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--accent); color:#fff;}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Framer</h1>
    <p>Logo → profile picture</p>
  </header>

  <div class="workspace">
    <!-- STAGE -->
    <section class="stage-panel">
      <div class="stage-frame">
        <div class="stage-frame-inner">
          <div class="stage" id="stage">
            <img id="dragImg" alt="" draggable="false">
            <div class="crop-mask" id="cropMask"></div>
            <div class="ring-preview" id="ringPreview"></div>
            <div class="placeholder" id="placeholder">
              <div class="icon">＋</div>
              <strong>Add a logo</strong>
              <span>Tap to upload, or drag a file here</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hud"><span id="hudZoom">100%</span> · <span id="hudSize">1024 × 1024</span></div>
      <div class="stage-actions">
        <button class="text-btn" id="replaceBtn">Replace</button>
        <button class="text-btn" id="centerBtn">Recenter</button>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </section>

    <!-- CONTROLS -->
    <aside class="controls">

      <div class="group">
        <div class="row">
          <label>Zoom</label>
          <div class="slider-row">
            <input type="range" id="zoomSlider" min="100" max="400" value="100" step="1">
          </div>
        </div>
      </div>

      <div class="group">
        <div class="row">
          <label>Border</label>
          <div class="switch on" id="borderSwitch"></div>
        </div>
        <div class="row">
          <label>Style</label>
          <select id="borderStyle">
            <option value="solid">Solid</option>
            <option value="dashed">Dashed</option>
            <option value="dotted">Dotted</option>
            <option value="double">Double</option>
          </select>
        </div>
        <div class="row">
          <label>Thickness</label>
          <div class="slider-row">
            <input type="range" id="borderWidth" min="0" max="60" value="24">
            <span class="value" id="borderWidthVal">24</span>
          </div>
        </div>
        <div class="row">
          <label>Padding</label>
          <div class="slider-row">
            <input type="range" id="borderGap" min="0" max="50" value="8">
            <span class="value" id="borderGapVal">8</span>
          </div>
        </div>
        <div class="row">
          <label>Color</label>
          <div class="swatch" id="borderSwatch" style="background:#ffffff;">
            <input type="color" id="borderColor" value="#ffffff">
          </div>
        </div>
      </div>

      <div class="group">
        <div class="row">
          <label>Background</label>
          <div class="segmented" id="bgSeg">
            <button data-mode="transparent" class="active">Clear</button>
            <button data-mode="solid">Fill</button>
          </div>
        </div>
        <div class="row" id="bgColorRow" style="display:none;">
          <label>Color</label>
          <div class="swatch" id="bgSwatch" style="background:#1c1c1e;">
            <input type="color" id="bgColor" value="#1c1c1e">
          </div>
        </div>
      </div>

      <div class="group">
        <div class="row">
          <label>Size</label>
          <div class="segmented" id="sizeSeg">
            <button data-size="512">512</button>
            <button data-size="1024" class="active">1024</button>
            <button data-size="2048">2048</button>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="result-row">
          <div class="result-canvas-wrap"><canvas id="resultCanvas"></canvas></div>
          <div class="result-text">Live result — <b>matches your export exactly</b>, transparent outside the ring.</div>
        </div>
      </div>

    </aside>
  </div>
</div>

<div class="export-bar">
  <div class="inner">
    <button class="save-btn" id="saveBtn">Save profile picture</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const UNIT = 1000; // virtual coordinate space for the square stage

  // ---- state ----
  let img = null;
  let naturalW = 0, naturalH = 0;
  let baseScale = 0;
  let userScale = 1;
  let dispW = 0, dispH = 0;
  let offX = 0, offY = 0;

  let borderEnabled = true;
  let borderStyle = 'solid';
  let borderWidthRef = 24;
  let borderGapRef = 8;
  let borderColor = '#ffffff';
  let bgMode = 'transparent';
  let bgColor = '#1c1c1e';
  let outputSize = 1024;

  // ---- elements ----
  const stage = document.getElementById('stage');
  const dragImg = document.getElementById('dragImg');
  const placeholder = document.getElementById('placeholder');
  const cropMask = document.getElementById('cropMask');
  const ringPreview = document.getElementById('ringPreview');
  const fileInput = document.getElementById('fileInput');
  const zoomSlider = document.getElementById('zoomSlider');
  const hudZoom = document.getElementById('hudZoom');
  const hudSize = document.getElementById('hudSize');
  const resultCanvas = document.getElementById('resultCanvas');
  const toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 2600);
  }

  // ---------------- Rect cache (avoids layout thrash during drag) ----------------
  let cachedRect = null;
  function currentRect(){
    return cachedRect || stage.getBoundingClientRect();
  }

  // ---------------- Image loading ----------------
  function loadFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e=>{
      const image = new Image();
      image.onload = ()=>{
        img = image;
        naturalW = image.naturalWidth;
        naturalH = image.naturalHeight;
        dragImg.src = e.target.result;
        placeholder.style.display = 'none';
        userScale = 1;
        zoomSlider.value = 100;
        resetFit();
        layoutImage();
        updateOverlays();
        renderResult();
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function resetFit(){
    baseScale = Math.max(UNIT / naturalW, UNIT / naturalH);
    dispW = naturalW * baseScale * userScale;
    dispH = naturalH * baseScale * userScale;
    offX = (UNIT - dispW) / 2;
    offY = (UNIT - dispH) / 2;
  }

  function layoutImage(){
    dragImg.style.width = (dispW/10) + '%';
    dragImg.style.height = (dispH/10) + '%';
    const rect = currentRect();
    const px = offX/UNIT*rect.width;
    const py = offY/UNIT*rect.height;
    dragImg.style.transform = `translate3d(${px}px, ${py}px, 0)`;
  }

  function clampOffsets(){
    const minX = Math.min(0, UNIT - dispW);
    const minY = Math.min(0, UNIT - dispH);
    offX = Math.max(minX, Math.min(0, offX));
    offY = Math.max(minY, Math.min(0, offY));
  }

  function applyZoom(newScale, anchorRatioX, anchorRatioY){
    newScale = Math.max(1, Math.min(4, newScale));
    const oldDispW = dispW, oldDispH = dispH;
    userScale = newScale;
    dispW = naturalW * baseScale * userScale;
    dispH = naturalH * baseScale * userScale;
    const ax = anchorRatioX === undefined ? 0.5 : anchorRatioX;
    const ay = anchorRatioY === undefined ? 0.5 : anchorRatioY;
    offX -= (dispW - oldDispW) * ax;
    offY -= (dispH - oldDispH) * ay;
    clampOffsets();
    layoutImage();
    zoomSlider.value = Math.round(userScale*100);
    hudZoom.textContent = Math.round(userScale*100) + '%';
  }

  function withSnap(fn){
    dragImg.style.transition = 'transform .32s cubic-bezier(.22,1,.36,1)';
    fn();
    setTimeout(()=>{ dragImg.style.transition = 'none'; }, 340);
  }

  // ---------------- Overlay geometry (mask + ring) ----------------
  // size is expressed in the SAME units as the space it's drawn into,
  // scaleF converts the borderWidthRef/borderGapRef "per-1000" values
  // into that space so the on-screen ring and the exported ring always match.
  function geometry(size){
    const scaleF = size / UNIT;
    const strokeW = borderEnabled ? borderWidthRef * scaleF : 0;
    const gapW = borderGapRef * scaleF;
    const outerR = size/2 - strokeW/2;
    const contentR = Math.max(0, outerR - strokeW/2 - gapW);
    return {strokeW, outerR, contentR};
  }

  function updateOverlays(){
    const {strokeW, outerR, contentR} = geometry(UNIT);
    const cd = (contentR*2/UNIT*100);
    cropMask.style.width = cd + '%';
    cropMask.style.height = cd + '%';

    if(borderEnabled && strokeW > 0){
      ringPreview.style.display = 'block';
      const rectW = currentRect().width || stage.getBoundingClientRect().width || 340;
      const strokePx = Math.max(1, (strokeW/UNIT) * rectW);
      const od = (outerR*2/UNIT*100);
      ringPreview.style.width = od + '%';
      ringPreview.style.height = od + '%';
      ringPreview.style.borderStyle = borderStyle === 'double' ? 'double' : borderStyle;
      ringPreview.style.borderColor = borderColor;
      ringPreview.style.borderWidth = (borderStyle === 'double' ? strokePx*1.35 : strokePx) + 'px';
    } else {
      ringPreview.style.display = 'none';
    }
  }

  // ---------------- Canvas render (used for live result + export — same code path) ----------------
  function renderToCanvas(canvas, size){
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);

    if(bgMode === 'solid'){
      ctx.fillStyle = bgColor;
      ctx.fillRect(0,0,size,size);
    }

    const {strokeW, outerR, contentR} = geometry(size);
    const cx = size/2, cy = size/2;
    const scaleF = size / UNIT;

    if(img){
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(contentR,0), 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(img, offX*scaleF, offY*scaleF, dispW*scaleF, dispH*scaleF);
      ctx.restore();
    }

    if(borderEnabled && strokeW > 0){
      ctx.save();
      ctx.strokeStyle = borderColor;
      ctx.lineCap = 'butt';
      const ringR = outerR;
      if(borderStyle === 'dashed'){
        ctx.setLineDash([strokeW*1.6, strokeW*1.15]);
        ctx.lineWidth = strokeW;
        ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2); ctx.stroke();
      } else if(borderStyle === 'dotted'){
        ctx.setLineDash([strokeW*0.18, strokeW*1.05]);
        ctx.lineCap = 'round';
        ctx.lineWidth = strokeW;
        ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2); ctx.stroke();
      } else if(borderStyle === 'double'){
        ctx.setLineDash([]);
        ctx.lineWidth = strokeW*0.32;
        const gapD = strokeW*0.42;
        ctx.beginPath(); ctx.arc(cx,cy,ringR+gapD,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx,cy,ringR-gapD,0,Math.PI*2); ctx.stroke();
      } else {
        ctx.setLineDash([]);
        ctx.lineWidth = strokeW;
        ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function renderResult(){
    renderToCanvas(resultCanvas, 240);
  }

  // ---------------- Pointer drag (transform-based + rAF throttled for smoothness) ----------------
  let dragging = false;
  let dragStartX=0, dragStartY=0, startOffX=0, startOffY=0;
  const activePointers = new Map();
  let pinchStartDist = 0, pinchStartScale = 1;
  let moveScheduled = false;

  stage.addEventListener('pointerdown', e=>{
    if(!img) return;
    dragImg.style.transition = 'none';
    stage.setPointerCapture(e.pointerId);
    cachedRect = stage.getBoundingClientRect();
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size === 1){
      dragging = true;
      stage.classList.add('dragging');
      dragStartX = e.clientX; dragStartY = e.clientY;
      startOffX = offX; startOffY = offY;
    } else if(activePointers.size === 2){
      dragging = false;
      const pts = [...activePointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinchStartScale = userScale;
    }
  });

  function processMove(){
    moveScheduled = false;
    const rect = currentRect();

    if(activePointers.size === 2){
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
      const ax = (midX - rect.left)/rect.width, ay = (midY - rect.top)/rect.height;
      if(pinchStartDist > 0){
        applyZoom(pinchStartScale * (dist/pinchStartDist), ax, ay);
      }
      return;
    }

    if(dragging){
      const dxUnit = (dragCurX - dragStartX) / rect.width * UNIT;
      const dyUnit = (dragCurY - dragStartY) / rect.height * UNIT;
      offX = startOffX + dxUnit;
      offY = startOffY + dyUnit;
      clampOffsets();
      layoutImage();
    }
  }

  let dragCurX = 0, dragCurY = 0;
  stage.addEventListener('pointermove', e=>{
    if(!img || !activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    dragCurX = e.clientX; dragCurY = e.clientY;
    if(!moveScheduled){
      moveScheduled = true;
      requestAnimationFrame(processMove);
    }
  });

  function endPointer(e){
    activePointers.delete(e.pointerId);
    if(activePointers.size === 0){
      if(dragging) renderResult();
      dragging = false;
      stage.classList.remove('dragging');
      cachedRect = null;
    } else if(activePointers.size === 1){
      const [pt] = [...activePointers.values()];
      dragging = true;
      dragStartX = pt.x; dragStartY = pt.y;
      startOffX = offX; startOffY = offY;
      renderResult();
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  stage.addEventListener('wheel', e=>{
    if(!img) return;
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const ax = (e.clientX - rect.left)/rect.width, ay = (e.clientY - rect.top)/rect.height;
    applyZoom(userScale - e.deltaY*0.0018, ax, ay);
    renderResult();
  }, {passive:false});

  // ---------------- Upload / drop ----------------
  placeholder.addEventListener('click', ()=>fileInput.click());
  document.getElementById('replaceBtn').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', e=>{
    if(e.target.files[0]) loadFile(e.target.files[0]);
  });
  stage.addEventListener('dragover', e=>{ e.preventDefault(); });
  stage.addEventListener('drop', e=>{
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) loadFile(file);
  });

  document.getElementById('centerBtn').addEventListener('click', ()=>{
    if(!img) return;
    withSnap(()=>{
      userScale = 1;
      resetFit();
      layoutImage();
    });
    zoomSlider.value = 100;
    hudZoom.textContent = '100%';
    renderResult();
  });

  // ---------------- Zoom slider ----------------
  zoomSlider.addEventListener('input', ()=>{
    if(!img) return;
    applyZoom(zoomSlider.value/100);
  });
  zoomSlider.addEventListener('change', renderResult);

  // ---------------- Border controls ----------------
  const borderSwitch = document.getElementById('borderSwitch');
  borderSwitch.addEventListener('click', ()=>{
    borderEnabled = !borderEnabled;
    borderSwitch.classList.toggle('on', borderEnabled);
    updateOverlays(); renderResult();
  });

  document.getElementById('borderStyle').addEventListener('change', e=>{
    borderStyle = e.target.value;
    updateOverlays(); renderResult();
  });

  const borderWidthInput = document.getElementById('borderWidth');
  const borderWidthVal = document.getElementById('borderWidthVal');
  borderWidthInput.addEventListener('input', e=>{
    borderWidthRef = +e.target.value;
    borderWidthVal.textContent = borderWidthRef;
    updateOverlays(); renderResult();
  });

  const borderGapInput = document.getElementById('borderGap');
  const borderGapVal = document.getElementById('borderGapVal');
  borderGapInput.addEventListener('input', e=>{
    borderGapRef = +e.target.value;
    borderGapVal.textContent = borderGapRef;
    updateOverlays(); renderResult();
  });

  const borderColorInput = document.getElementById('borderColor');
  const borderSwatch = document.getElementById('borderSwatch');
  borderColorInput.addEventListener('input', e=>{
    borderColor = e.target.value;
    borderSwatch.style.background = borderColor;
    updateOverlays(); renderResult();
  });

  // ---------------- Background controls ----------------
  const bgColorRow = document.getElementById('bgColorRow');
  document.querySelectorAll('#bgSeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#bgSeg button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      bgMode = btn.dataset.mode;
      bgColorRow.style.display = bgMode === 'solid' ? 'flex' : 'none';
      renderResult();
    });
  });
  const bgColorInput = document.getElementById('bgColor');
  const bgSwatch = document.getElementById('bgSwatch');
  bgColorInput.addEventListener('input', e=>{
    bgColor = e.target.value;
    bgSwatch.style.background = bgColor;
    renderResult();
  });

  // ---------------- Output size ----------------
  document.querySelectorAll('#sizeSeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#sizeSeg button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      outputSize = +btn.dataset.size;
      hudSize.textContent = outputSize + ' × ' + outputSize;
    });
  });

  // ---------------- Resize (keeps the square stage and image in sync) ----------------
  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      cachedRect = null;
      updateOverlays();
      if(img) layoutImage();
    }, 60);
  });

  // ---------------- Save / Export ----------------
  const isMobileUA = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.textContent = isMobileUA ? 'Save to Photos' : 'Download PNG';

  function downloadBlob(blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'profile-picture.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  saveBtn.addEventListener('click', ()=>{
    if(!img){ showToast('Upload a logo first'); return; }
    const exportCanvas = document.createElement('canvas');
    renderToCanvas(exportCanvas, outputSize);
    exportCanvas.toBlob(async blob=>{
      if(!blob){ showToast('Export failed — try again'); return; }
      const file = new File([blob], 'profile-picture.png', {type:'image/png'});
      if(isMobileUA && navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'Profile picture'});
          showToast('Choose "Save Image" to add it to your gallery');
        }catch(err){
          if(err && err.name !== 'AbortError'){
            downloadBlob(blob);
            showToast('Saved to your downloads');
          }
        }
      } else {
        downloadBlob(blob);
        showToast(isMobileUA ? 'Saved to your downloads' : 'Downloaded');
      }
    }, 'image/png', 1);
  });

  // init
  document.getElementById('borderSwitch').classList.add('on');
  updateOverlays();
  hudSize.textContent = outputSize + ' × ' + outputSize;
})();
</script>
</body>
</html>
